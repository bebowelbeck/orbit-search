
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit Search</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #10131c;
      color: #f4f6ff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 70px 20px;
    }

    h1 { font-size: 44px; margin-bottom: 8px; }
    p { color: #aab2c5; }

    form {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 700px;
      margin: 24px 0;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #394158;
      background: #1b2030;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 15px 20px;
      border: 0;
      border-radius: 10px;
      background: #8b7cff;
      color: #10131c;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      width: 100%;
      max-width: 900px;
      min-height: 100px;
      padding: 20px;
      border: 1px solid #394158;
      border-radius: 12px;
      background: #1b2030;
      overflow-wrap: anywhere;
    }

    iframe {
      width: 100%;
      height: 500px;
      border: 1px solid #394158;
      border-radius: 12px;
      background: white;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Orbit Search</h1>
  <p>Web fetching experiment</p>

  <form id="searchForm">
    <input id="urlInput" type="url"
      placeholder="https://example.com"
      value="https://example.com" required>
    <button type="submit">Fetch</button>
  </form>

  <div id="result" role="status">
    Enter a test address and press Fetch.
  </div>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("urlInput");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.textContent = "Fetching test page...";

      try {
        const response = await fetch("/fetch");
        const data = await response.json();

        if (!response.ok || !data.html) {
          throw new Error(data.error || "Fetch failed");
        }

        result.textContent =
          "Fetch successful! HTTP status: " + data.status_code +
          ". The backend returned HTML (" + data.html.length +
          " characters). This test page is returned as text, not rendered.";
      } catch (error) {
        result.textContent = "Error: " + error.message;
      }
    });
  </script>
</body>
</html>
